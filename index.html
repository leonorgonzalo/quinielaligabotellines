<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--surface:#fafafa;--surface2:#f2f2f2;--border:#e2e2e2;
  --text:#141414;--text2:#5a5a5a;--text3:#9a9a9a;
  --betis:#00a650;--sevilla:#c8102e;
  --gold:#c98a00;--silver:#7d8a99;--bronze:#a9612a;
}
html{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
body{max-width:720px;margin:0 auto;padding:0 14px 80px}
h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;line-height:1.1}
h2{font-size:17px;font-weight:600;margin-bottom:10px}
h3{font-size:14px;font-weight:600;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:14px;font-weight:500;font-family:'Inter',sans-serif;transition:.15s}
.btn:hover{border-color:var(--text2)}
.btn-betis{background:var(--betis);border-color:var(--betis);color:#fff}
.btn-betis:hover{background:#008f45;border-color:#008f45;color:#fff}
.btn-sevilla{background:var(--sevilla);border-color:var(--sevilla);color:#fff}
.btn-sevilla:hover{background:#a50d26;border-color:#a50d26;color:#fff}
.btn-sm{padding:6px 11px;font-size:13px}
.btn-ghost{border-color:transparent;color:var(--text2)}
.btn-ghost:hover{color:var(--text);border-color:var(--border)}
.btn-danger{border-color:#7f1d1d;color:#ef4444}
.btn-danger:hover{background:#1c0a0a}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
input,select{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);color:var(--text);font-size:14px;font-family:'Inter',sans-serif;transition:.15s}
input:focus,select:focus{outline:none;border-color:var(--betis);box-shadow:0 0 0 3px rgba(0,166,80,.15)}
input::placeholder{color:var(--text3)}
select option{background:#fff;color:var(--text)}
label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;letter-spacing:.4px;text-transform:uppercase}
.form-group{margin-bottom:12px}
.tab-bar{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:14px;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab{padding:8px 13px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text2);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;font-family:'Inter',sans-serif}
.tab:hover{color:var(--text)}
.tab.active.betis{color:var(--betis);border-bottom-color:var(--betis)}
.tab.active.sevilla{color:var(--sevilla);border-bottom-color:var(--sevilla)}
.tab.active{color:var(--text);border-bottom-color:var(--text)}

/* MATCH ROW */
.match-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.match-row:last-child{border-bottom:none}
.match-info{display:flex;flex-direction:column;gap:1px}
.match-name{font-size:13px;color:var(--text)}
.match-meta{font-size:11px;color:var(--text3)}
.radio-group{display:flex;gap:4px}
.radio-btn{width:34px;height:29px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;background:transparent;color:var(--text3);transition:.15s;font-family:'Inter',sans-serif}
.radio-btn:hover{border-color:var(--text2);color:var(--text)}
.radio-btn.sel{background:var(--surface2);border-color:var(--text2);color:var(--text)}
.radio-btn.sel.betis{background:var(--betis);border-color:var(--betis);color:#fff}
.radio-btn.sel.sevilla{background:var(--sevilla);border-color:var(--sevilla);color:#fff}
.radio-btn.correct{background:#16a34a;border-color:#16a34a;color:#fff}
.radio-btn.wrong{background:#fde2e2;border-color:#ef4444;color:#b91c1c}
.radio-btn.pending{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.match-stats{display:none;padding:6px 0 8px;border-bottom:1px solid var(--border)}
.match-stats.open{display:block}
.stat-bar-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px}
.stat-bar-bg{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.stat-lbl{width:12px;font-weight:700;color:var(--text2)}
.stat-count{width:60px;color:var(--text3);text-align:right}

/* DERBY CARD */
.derby-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
.derby-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(135deg,rgba(200,16,46,.15),rgba(0,166,80,.15));border-bottom:1px solid var(--border)}
.derby-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px}
.derby-body{padding:14px 16px}
.derby-teams{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.derby-team{flex:1;text-align:center;font-weight:700;font-size:14px}
.derby-team.sev{color:var(--sevilla)}
.derby-team.bet{color:var(--betis)}
.derby-vs{color:var(--text3);font-weight:600}

/* HERO */
.hero{padding:18px 0 16px;margin-bottom:18px;border-bottom:1px solid var(--border)}
.hero-logo{display:block;max-width:190px;width:45%;height:auto;margin-bottom:12px}
.hero-stripe{height:4px;background:linear-gradient(90deg,var(--sevilla) 50%,var(--betis) 50%);border-radius:2px;margin-bottom:16px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between}
.hero-sub{color:var(--text2);font-size:13px;margin-top:4px}

/* RANKING */
.rank-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px}
.rank-row:hover{background:var(--surface2)}
.rank-num{font-size:16px;font-weight:700;width:26px;text-align:center;color:var(--text3);font-family:'Bebas Neue',sans-serif}
.rank-num.gold{color:var(--gold)}.rank-num.silver{color:var(--silver)}.rank-num.bronze{color:var(--bronze)}
.rank-name{flex:1;font-weight:500}
.rank-name.betis{color:var(--betis)}
.rank-name.sevilla{color:var(--sevilla)}
.rank-pts{font-size:20px;font-weight:700;color:var(--text);font-family:'Bebas Neue',sans-serif}
.progress-bar{height:3px;background:var(--border);border-radius:2px;margin-top:3px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--sevilla),var(--betis));border-radius:2px}
.top3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px}
.top3-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center}
.top3-card.first{border-color:var(--gold)}
.top3-card .medal{font-size:22px;margin-bottom:3px}
.top3-card .pname{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top3-card .ppts{font-size:22px;font-weight:700;color:var(--text);font-family:'Bebas Neue',sans-serif}
.pos-change{font-size:11px;font-weight:700;width:28px;text-align:center;flex-shrink:0}
.pos-change.up{color:#15803d}.pos-change.down{color:#dc2626}.pos-change.same{color:var(--text3)}

/* STATUS */
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:500}
.tag-green{background:rgba(22,163,74,.12);color:#15803d}
.tag-amber{background:rgba(245,158,11,.15);color:var(--gold)}
.tag-betis{background:rgba(0,166,80,.15);color:var(--betis)}
.tag-sevilla{background:rgba(200,16,46,.15);color:var(--sevilla)}
.status-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.status-row:last-child{border-bottom:none}
.msg-ok{background:rgba(22,163,74,.08);border:1px solid rgba(22,163,74,.3);color:#15803d;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:10px}
.msg-err{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.3);color:#b91c1c;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:8px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:16px}
.nav-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px}
.admin-badge{background:rgba(245,158,11,.15);color:var(--gold);font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600}
.count-pill{background:var(--surface2);color:var(--text2);border-radius:20px;font-size:12px;font-weight:500;padding:3px 10px}
.sticky-tabs{position:sticky;top:0;background:var(--bg);z-index:10;padding:6px 0 0}
.divider{height:1px;background:var(--border);margin:14px 0}
.lock-banner{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);color:var(--gold);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.section-label{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;color:var(--text2);padding:8px 0 4px;border-top:1px solid var(--border);margin-top:8px}
input.correct,select.correct{border-color:#16a34a;color:#15803d;background:rgba(22,163,74,.07)}

      S.bonus=d.bonus||{};
      S.snapshot=d.snapshot||[];
      const jg=d.results?.jugadores||{};
      S.jugadores={
        betis:(jg.betis&&jg.betis.length)?jg.betis:[...PLANTILLA_DEFAULT.betis],
        sevilla:(jg.sevilla&&jg.sevilla.length)?jg.sevilla:[...PLANTILLA_DEFAULT.sevilla],
      };
      S.meta=d.meta||{cuota:10,locked:false};
    }
  }catch(e){console.error('Error loading:',e);}
}

// ── PUNTOS ──
function calcPts(uid){
  const p=S.participants[uid],r=S.results;
  if(!p) return 0;
  let pts=0;
  // Betis partidos normales (3pts)
  PARTIDOS_BETIS.forEach((_,i)=>{
    if(i===DERBY_B13||i===DERBY_B23) return; // derbis aparte
    if(p.betis?.[i]&&r.betis?.[i]&&p.betis[i]===r.betis[i]) pts+=3;
  });
  // Sevilla partidos normales (3pts)
  PARTIDOS_SEVILLA.forEach((_,i)=>{
    if(i===DERBY_S13||i===DERBY_S23) return;
    if(p.sevilla?.[i]&&r.sevilla?.[i]&&p.sevilla[i]===r.sevilla[i]) pts+=3;
  });
  // Derbis
  ['d1','d2'].forEach(dk=>{
    const pd=p.derbis?.[dk],rd=r.derbis?.[dk];
    if(!pd||!rd) return;
    if(pd.signo&&rd.signo&&pd.signo===rd.signo) pts+=3;
    if(pd.resultado&&rd.resultado&&pd.resultado===rd.resultado) pts+=3;
    // minuto primer gol
    if(pd.minuto&&rd.minuto){
      const pm=parseInt(pd.minuto),rm=parseInt(rd.minuto);
      if(!isNaN(pm)&&!isNaN(rm)&&pm<=rm){
        // check if this participant is among the closest without passing
        const allMins=Object.values(S.participants)
          .map(x=>parseInt(x.derbis?.[dk]?.minuto))
          .filter(m=>!isNaN(m)&&m<=rm);
        if(allMins.length>0){
          const best=Math.max(...allMins);
          if(pm===best) pts+=5;
        }
      }
    }
  });
  // Pichichi
  if(p.pich_betis&&r.pich_betis&&p.pich_betis.trim().toLowerCase()===r.pich_betis.trim().toLowerCase()) pts+=10;
  if(p.pich_sevilla&&r.pich_sevilla&&p.pich_sevilla.trim().toLowerCase()===r.pich_sevilla.trim().toLowerCase()) pts+=10;
  // Bonus
  pts+=parseInt(S.bonus?.[uid]||0);
  return pts;
}

function getRank(){
  return Object.keys(S.participants)
    .map(uid=>({uid,nombre:S.participants[uid].nombre,equipo:S.participants[uid].equipo||'',pts:calcPts(uid)}))
    .sort((a,b)=>b.pts-a.pts);
}

  partidos.forEach((m,i)=>{
    if(m.derby) return; // derbis en otra pestaña
    const v=pronosticos[i]||'';

    const correct=showGreen&&!!v&&hasResult&&v===rv;

      if(wrong) return 'radio-btn wrong';
      if(pending) return 'radio-btn pending';
      return `radio-btn sel ${color}`;

    const votos={1:0,X:0,2:0};
    if(!isAdmin) Object.values(S.participants).forEach(pp=>{const vv=pp[equipo]?.[i];if(vv)votos[vv]++;});

function clampMinuto(v){
  const s=String(v).replace(/[^0-9]/g,'');
  if(s==='') return '';
  let n=parseInt(s,10);
  if(isNaN(n)) return '';
  if(n>90) n=90;
  if(n<0) n=0;
  return String(n);
}
function setDerby(key,campo,val){

  if(!S.participants[S.user].derbis[key]) S.participants[S.user].derbis[key]={};
  S.participants[S.user].derbis[key][campo]=campo==='minuto'?clampMinuto(val):val;
  if(campo==='signo') renderQ();
}
function setAdminDerby(key,campo,val){

  if(!S.results.derbis[key]) S.results.derbis[key]={};
  S.results.derbis[key][campo]=campo==='minuto'?clampMinuto(val):val;
  if(campo==='signo') renderAdminRes();
}

// ── CALCPTS DETALLE ──
function calcPtsDetalle(uid){
  const p=S.participants[uid],r=S.results;
  if(!p) return {betis:0,sevilla:0,d1:0,d2:0,pichi:0,bonus:0,total:0};
  const d={betis:0,sevilla:0,d1:0,d2:0,pichi:0,bonus:0};
  PARTIDOS_BETIS.forEach((_,i)=>{
    if(i===DERBY_B13||i===DERBY_B23) return;
    if(p.betis?.[i]&&r.betis?.[i]&&p.betis[i]===r.betis[i]) d.betis+=3;
  });
  PARTIDOS_SEVILLA.forEach((_,i)=>{
    if(i===DERBY_S13||i===DERBY_S23) return;
    if(p.sevilla?.[i]&&r.sevilla?.[i]&&p.sevilla[i]===r.sevilla[i]) d.sevilla+=3;
  });
  ['d1','d2'].forEach(dk=>{
    const pd=p.derbis?.[dk],rd=r.derbis?.[dk];
    if(!pd||!rd) return;
    if(pd.signo&&rd.signo&&pd.signo===rd.signo) d[dk]+=3;
    if(pd.resultado&&rd.resultado&&pd.resultado===rd.resultado) d[dk]+=3;
    if(pd.minuto&&rd.minuto){
      const pm=parseInt(pd.minuto),rm=parseInt(rd.minuto);
      if(!isNaN(pm)&&!isNaN(rm)&&pm<=rm){
        const allMins=Object.values(S.participants).map(x=>parseInt(x.derbis?.[dk]?.minuto)).filter(m=>!isNaN(m)&&m<=rm);
        if(allMins.length>0&&pm===Math.max(...allMins)) d[dk]+=5;
      }
    }
  });
  if(p.pich_betis&&r.pich_betis&&p.pich_betis.trim().toLowerCase()===r.pich_betis.trim().toLowerCase()) d.pichi+=10;
  if(p.pich_sevilla&&r.pich_sevilla&&p.pich_sevilla.trim().toLowerCase()===r.pich_sevilla.trim().toLowerCase()) d.pichi+=10;
  d.bonus=parseInt(S.bonus?.[uid]||0);
  d.total=d.betis+d.sevilla+d.d1+d.d2+d.pichi+d.bonus;
  return d;
}

// ── ESTADISTICAS ──
function getProgreso(){
  const rb=S.results.betis||{},rs=S.results.sevilla||{},rd=S.results.derbis||{};
  let jugados=0;
  PARTIDOS_BETIS.forEach((m,i)=>{if(i!==DERBY_B13&&i!==DERBY_B23&&rb[i])jugados++;});
  PARTIDOS_SEVILLA.forEach((m,i)=>{if(i!==DERBY_S13&&i!==DERBY_S23&&rs[i])jugados++;});
  if(rd.d1?.signo)jugados+=2;
  if(rd.d2?.signo)jugados+=2;
  const total=36+36+4;
  // jornada aproximada: la mas alta con resultado
  let jornada=0;
  PARTIDOS_BETIS.forEach((m,i)=>{if(rb[i]||((i===DERBY_B13)&&rd.d1?.signo)||((i===DERBY_B23)&&rd.d2?.signo))jornada=Math.max(jornada,m.j);});
  PARTIDOS_SEVILLA.forEach((m,i)=>{if(rs[i]||((i===DERBY_S13)&&rd.d1?.signo)||((i===DERBY_S23)&&rd.d2?.signo))jornada=Math.max(jornada,m.j);});
  return {jugados,total,jornada,pct:Math.round(jugados/total*100)};
}
function getRacha(uid){
  const p=S.participants[uid];
  if(!p) return {actual:0,mejor:0};
  // recorre todos los partidos con resultado en orden cronologico
  const eventos=[];
  PARTIDOS_BETIS.forEach((m,i)=>{
    if(i===DERBY_B13||i===DERBY_B23) return;
    const rv=S.results.betis?.[i];
    if(rv) eventos.push({j:m.j,fecha:m.fecha,ok:p.betis?.[i]===rv});
  });
  PARTIDOS_SEVILLA.forEach((m,i)=>{
    if(i===DERBY_S13||i===DERBY_S23) return;
    const rv=S.results.sevilla?.[i];
    if(rv) eventos.push({j:m.j,fecha:m.fecha,ok:p.sevilla?.[i]===rv});
  });
  ['d1','d2'].forEach((dk,n)=>{
    const rd=S.results.derbis?.[dk];
    if(rd?.signo) eventos.push({j:n===0?13:23,fecha:'',ok:p.derbis?.[dk]?.signo===rd.signo});
  });
  eventos.sort((a,b)=>a.j-b.j);
  let actual=0,mejor=0,run=0;
  eventos.forEach(e=>{
    if(e.ok){run++;mejor=Math.max(mejor,run);} else run=0;
  });
  actual=run;
  return {actual,mejor,total:eventos.length};
}
function getDuelo(){
  const rank=getRank();
  const bet=rank.filter(p=>p.equipo==='betis');
  const sev=rank.filter(p=>p.equipo==='sevilla');
  const media=arr=>arr.length?Math.round(arr.reduce((s,p)=>s+p.pts,0)/arr.length):0;
  return {
    betis:{n:bet.length,media:media(bet),mejor:bet[0]||null,total:bet.reduce((s,p)=>s+p.pts,0)},
    sevilla:{n:sev.length,media:media(sev),mejor:sev[0]||null,total:sev.reduce((s,p)=>s+p.pts,0)},
  };
}
function getVotos(equipo,i){
  const votos={1:0,X:0,2:0};
  const porEquipo={betis:{1:0,X:0,2:0},sevilla:{1:0,X:0,2:0}};
  Object.values(S.participants).forEach(pp=>{
    const vv=pp[equipo]?.[i];
    if(!vv) return;
    votos[vv]++;
    if(pp.equipo==='betis') porEquipo.betis[vv]++;
    else if(pp.equipo==='sevilla') porEquipo.sevilla[vv]++;
  });
  return {votos,porEquipo};
}

function buildPronosticos(){
  const n=Object.keys(S.participants).length;
  if(n===0) return '<div class="card" style="text-align:center;padding:28px"><p style="color:var(--text2)">Sin participantes aún.</p></div>';
  const bloque=(equipo,titulo,color)=>{
    const partidos=equipo==='betis'?PARTIDOS_BETIS:PARTIDOS_SEVILLA;
    const reales=S.results[equipo]||{};
    let out=`<div class="card" style="padding:14px 16px">
      <h3 style="margin-bottom:4px;color:var(--${color})">${titulo}</h3>
      <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Qué ha pronosticado el grupo en cada partido</p>`;
    partidos.forEach((m,i)=>{
      if(m.derby) return;
      const {votos,porEquipo}=getVotos(equipo,i);
      const tot=votos['1']+votos.X+votos['2'];
      if(tot===0) return;
      const pct=v=>Math.round(v/tot*100);
      const rv=reales[i]||'';
      const etiqueta={'1':'Gana '+m.local,'X':'Empate','2':'Gana '+m.visitante};
      out+=`<div style="padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">
          <span style="font-size:13px">${m.local} — ${m.visitante}</span>
          <span style="font-size:11px;color:var(--text3)">J${m.j}${rv?` · resultado <b style="color:var(--text2)">${rv}</b>`:''}</span>
        </div>
        ${['1','X','2'].map(opt=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:12px">
          <span style="width:96px;color:${rv===opt?'var(--text)':'var(--text3)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${etiqueta[opt]}</span>
          <div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;display:flex">
            <div style="width:${porEquipo.betis[opt]/tot*100}%;background:var(--betis)"></div>
            <div style="width:${porEquipo.sevilla[opt]/tot*100}%;background:var(--sevilla)"></div>
          </div>
          <span style="width:52px;text-align:right;color:${rv===opt?'#15803d':'var(--text3)'};font-weight:${rv===opt?'700':'400'}">${pct(votos[opt])}% (${votos[opt]})</span>
        </div>`).join('')}
      </div>`;
    });
    out+='</div>';
    return out;
  };
  let h=`<div class="card" style="padding:10px 14px;font-size:12px;color:var(--text2);display:flex;gap:14px;align-items:center;justify-content:center">
    <span><span style="display:inline-block;width:10px;height:10px;background:var(--betis);border-radius:2px;vertical-align:middle"></span> voto bético</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:var(--sevilla);border-radius:2px;vertical-align:middle"></span> voto sevillista</span>
  </div>`;
  h+=bloque('betis','🟢 Partidos del Betis','betis');
  h+=bloque('sevilla','🔴 Partidos del Sevilla','sevilla');
  return h;
}

async function borrar(uid){if(!confirm('¿Borrar a '+S.participants[uid]?.nombre+'?'))return;delete S.participants[uid];try{await fetch('/api/participant',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:uid})});}catch(e){}renderAdmin();}
async function toggleLock(){
  const next=!isLocked();
  if(!confirm(next?'¿Cerrar las quinielas?':'¿Reabrir las quinielas?')) return;
  S.meta.locked=next;
  try{await fetch('/api/lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({locked:next})});}catch(e){}
  renderAdmin();
}
function editBonus(uid,current){
  const val=prompt(`Puntos extra/penalización para ${S.participants[uid]?.nombre}:`,current);
  if(val===null) return;
  const n=parseInt(val);
  if(isNaN(n)){alert('Introduce un número.');return;}
  if(!S.bonus) S.bonus={};
  S.bonus[uid]=n;
  setBonus(uid,n);
  renderAdmin();
}
async function setBonus(uid,pts){try{await fetch('/api/bonus',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:uid,pts})});}catch(e){}}
async function fijarSnapshot(){
  if(!confirm('¿Fijar el ranking actual como referencia para las flechas?')) return;
  const snap=getRank().map(p=>({uid:p.uid,nombre:p.nombre,pts:p.pts}));
  try{
    const res=await fetch('/api/snapshot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({snapshot:snap})});
    if(res.ok){S.snapshot=snap;alert('✓ Ranking fijado.');}
  }catch(e){}
}

// ── ADMIN VER QUINIELA ──
function verQuiniela(uid){viewUid=uid;qtab='betis';RO=true;S.page='admin_ver';render();}
function closeVer(){RO=false;viewUid=null;qtab='betis';go('admin');}
function renderAdminVer(){
  const p=S.participants[viewUid];
  if(!p){closeVer();return;}
  RO=true;
  const d=calcPtsDetalle(viewUid);
  const tabs=[{id:'betis',l:'🟢 Betis'},{id:'sevilla',l:'🔴 Sevilla'},{id:'derbis',l:'⚔️ Derbis'},{id:'pichi',l:'🥇 Pichichi'}];
  let h=`<div class="nav">
    <button class="btn btn-sm btn-ghost" onclick="closeVer()">← Admin</button>
    <span class="nav-title">${p.nombre}</span>
    <span class="admin-badge">SOLO LECTURA</span></div>
  <div class="card" style="margin-bottom:12px;padding:10px 14px;font-size:13px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span style="color:var(--text2)">${p.nombre}</span>
      <b style="font-size:18px;font-family:'Bebas Neue',sans-serif">${d.total} pts</b>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:4px">
      ${[['Betis',d.betis,'3pts'],['Sevilla',d.sevilla,'3pts'],['Derby 1',d.d1,'6+5pts'],['Derby 2',d.d2,'6+5pts'],['Pichichi',d.pichi,'10pts'],...(d.bonus?[['Bonus',d.bonus,'']]:[])]
        .filter(([,v])=>v!==0)
        .map(([l,v,sub])=>`<div style="background:var(--surface2);border-radius:6px;padding:5px 8px">
          <div style="font-size:10px;color:var(--text3)">${l}</div>
          <div style="font-size:15px;font-weight:700;font-family:'Bebas Neue',sans-serif">${v} pts</div>
          <div style="font-size:10px;color:var(--text3)">${sub}</div>
        </div>`).join('')}
    </div>
  </div>
  <div class="sticky-tabs"><div class="tab-bar">
  ${tabs.map(t=>`<button class="tab${qtab===t.id?' active':''}" onclick="setQtab('${t.id}')">${t.l}</button>`).join('')}
  </div></div>`;
  if(qtab==='betis') h+=buildPartidos('betis',p);
  else if(qtab==='sevilla') h+=buildPartidos('sevilla',p);
  else if(qtab==='derbis') h+=buildDerbis(p);
  else if(qtab==='pichi') h+=buildPichi(p);
  app.innerHTML=h;
}

// ── ADMIN PAGOS ──
function renderAdminPagos(){
  if(!S.meta) S.meta={cuota:10};
  const rank=getRank();
  const pagados=rank.filter(p=>S.payments[p.uid]);
  const pendientes=rank.filter(p=>!S.payments[p.uid]);
  const pot=pagados.length*S.meta.cuota;
  let h=`<div class="nav">
    <button class="btn btn-sm btn-ghost" onclick="go('admin')">← Admin</button>
    <span class="nav-title">Control de pagos</span><span></span></div>
  <div class="card" style="margin-bottom:12px;background:rgba(245,158,11,.05);border-color:rgba(245,158,11,.2)">
    <h3 style="color:var(--gold);margin-bottom:10px">💰 Resumen económico</h3>
    <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:14px">
      <div><span style="color:var(--text2)">Cuota</span><br><b style="font-size:18px">${S.meta.cuota}€</b>
        <input type="number" min="1" max="200" value="${S.meta.cuota}" onchange="setCuota(this.value)" style="width:70px;margin-left:8px;display:inline-block;vertical-align:middle">
      </div>
      <div><span style="color:var(--text2)">Pagados</span><br><b style="font-size:18px;color:#15803d">${pagados.length}/${rank.length}</b></div>
      <div><span style="color:var(--text2)">Recaudado</span><br><b style="font-size:18px;color:var(--gold)">${pot}€</b></div>
    </div>
  </div>`;
  if(pendientes.length>0){
    h+=`<div class="card" style="margin-bottom:12px"><h3 style="margin-bottom:10px;color:#b91c1c">⏳ Pendientes (${pendientes.length})</h3>`;
    pendientes.forEach(p=>{
      h+=`<div class="status-row"><div><span style="font-weight:500">${p.nombre}</span><br><span style="font-size:12px;color:var(--text3)">${p.uid}</span></div>
        <button class="btn btn-sm" style="background:rgba(34,197,94,.15);border-color:#16a34a;color:#15803d" onclick="marcarPago('${p.uid}',true)">✓ Pagado</button></div>`;
    });
    h+=`</div>`;
  }
  if(pagados.length>0){
    h+=`<div class="card"><h3 style="margin-bottom:10px;color:#15803d">✓ Pagados (${pagados.length})</h3>`;
    pagados.forEach(p=>{
      h+=`<div class="status-row"><div><span style="font-weight:500">${p.nombre}</span></div>
        <button class="btn btn-sm btn-danger" onclick="marcarPago('${p.uid}',false)">✗</button></div>`;
    });
    h+=`</div>`;
  }
  app.innerHTML=h;
}
async function marcarPago(uid,paid){
  if(!S.payments) S.payments={};
  if(paid){const now=new Date();const fecha=now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear();S.payments[uid]={pagado:true,fecha};}
  else delete S.payments[uid];
  try{await fetch('/api/payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:uid,paid,fecha:S.payments[uid]?.fecha})});}catch(e){}
  renderAdminPagos();
}
async function setCuota(v){
  S.meta.cuota=parseInt(v)||10;
  try{await fetch('/api/meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cuota:S.meta.cuota})});}catch(e){}
  renderAdminPagos();
}

// ── ADMIN: PLANTILLAS ──
function buildJugadores(){
  if(!S.jugadores) S.jugadores={betis:[],sevilla:[]};
  const bloque=(equipo,titulo,color)=>{
    const lista=S.jugadores[equipo]||[];
    const grupos={POR:[],DEF:[],MED:[],DEL:[],OTROS:[]};
    lista.forEach((j,i)=>{
      const pos=(j.split(':')[0]||'').trim().toUpperCase();
      (grupos[pos]||grupos.OTROS).push({j,i});
    });
    const nombreGrupo={POR:'Porteros',DEF:'Defensas',MED:'Mediocampistas',DEL:'Delanteros',OTROS:'Otros'};
    let filas='';
    Object.keys(grupos).forEach(g=>{
      if(!grupos[g].length) return;
      filas+=`<div class="section-label">${nombreGrupo[g]}</div>`;
      grupos[g].forEach(({j,i})=>{
        filas+=`<div class="status-row">
          <span style="font-size:14px">${j}</span>
          <button class="btn btn-sm btn-danger" onclick="delJugador('${equipo}',${i})">🗑</button>
        </div>`;
      });
    });
    return `<div class="card">
      <h3 style="margin-bottom:4px;color:var(--${color})">${titulo}</h3>
      <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Estos jugadores saldrán en el desplegable del pichichi. Formato <b>POS: Nombre</b> (POR, DEF, MED, DEL).</p>
      <div style="display:flex;gap:6px;margin-bottom:10px">
        <input id="nj_${equipo}" placeholder="Ej: DEL: Juan Pérez" onkeydown="if(event.key==='Enter')addJugador('${equipo}')"/>
        <button class="btn btn-${color}" onclick="addJugador('${equipo}')">+ Añadir</button>
      </div>
      ${lista.length===0?'<p style="font-size:13px;color:var(--text3)">Sin jugadores.</p>':filas}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <span style="font-size:12px;color:var(--text3)">${lista.length} jugador${lista.length!==1?'es':''}</span>
        <button class="btn btn-sm btn-ghost" onclick="restaurarPlantilla('${equipo}')">↺ Restaurar plantilla</button>
      </div>
    </div>`;
  };
  return bloque('betis','🟢 Plantilla Real Betis','betis')
       + bloque('sevilla','🔴 Plantilla Sevilla F.C.','sevilla')
       + `<button class="btn btn-betis" style="width:100%;margin-top:4px" onclick="saveR()">💾 Guardar</button><div id="rsm"></div>`;
}
const POS_ORDEN={'POR':0,'DEF':1,'MED':2,'DEL':3};
function ordenarPlantilla(arr){
  arr.sort((a,b)=>{
    const pa=POS_ORDEN[(a.split(':')[0]||'').trim().toUpperCase()];
    const pb=POS_ORDEN[(b.split(':')[0]||'').trim().toUpperCase()];
    const oa=pa===undefined?9:pa, ob=pb===undefined?9:pb;
    if(oa!==ob) return oa-ob;
    return a.localeCompare(b,'es');
  });
  return arr;
}
function restaurarPlantilla(equipo){
  if(!confirm('¿Restaurar la plantilla original? Se perderán los cambios que hayas hecho en esta lista.')) return;
  S.jugadores[equipo]=[...PLANTILLA_DEFAULT[equipo]];
  S.results.jugadores=S.jugadores;
  renderRtab(4);
}
function addJugador(equipo){
  const el=document.getElementById('nj_'+equipo);
  const v=(el?.value||'').trim();
  if(!v) return;
  if(!S.jugadores) S.jugadores={betis:[],sevilla:[]};
  if(!S.jugadores[equipo]) S.jugadores[equipo]=[];
  if(S.jugadores[equipo].some(j=>j.toLowerCase()===v.toLowerCase())){alert('Ese jugador ya está en la lista.');return;}
  S.jugadores[equipo].push(v);
  ordenarPlantilla(S.jugadores[equipo]);
  S.results.jugadores=S.jugadores;
  renderRtab(4);
}
function delJugador(equipo,i){
  if(!confirm('¿Quitar a '+S.jugadores[equipo][i]+' de la lista?')) return;
  S.jugadores[equipo].splice(i,1);
  S.results.jugadores=S.jugadores;
  renderRtab(4);
}

// ── ADMIN RESULTADOS ──
let rt=0;
function renderAdminRes(){
  const tabs=['🟢 Betis','🔴 Sevilla','⚔️ Derbis','🥇 Pichichi','👥 Jugadores'];
  let h=`<div class="nav">
    <button class="btn btn-sm btn-ghost" onclick="go('admin')">← Admin</button>
    <span class="nav-title">Resultados reales</span><span></span></div>
  <div class="sticky-tabs"><div class="tab-bar">
  ${tabs.map((t,i)=>`<button class="tab${rt===i?' active':''}" onclick="setRt(${i})">${t}</button>`).join('')}
  </div></div><div id="rc"></div>`;
  app.innerHTML=h;
  renderRtab(rt);
}
function setRt(i){rt=i;document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i));renderRtab(i);}
function renderRtab(i){
  const c=document.getElementById('rc');
  if(!c) return;
  if(i===0) c.innerHTML=buildPartidos('betis',null,true);
  else if(i===1) c.innerHTML=buildPartidos('sevilla',null,true);
  else if(i===2) c.innerHTML=buildDerbis({derbis:S.results.derbis||{}},true);
  else if(i===3) c.innerHTML=buildPichi({pich_betis:S.results.pich_betis||'',pich_sevilla:S.results.pich_sevilla||''},true);
  else if(i===4) c.innerHTML=buildJugadores();
}
async function saveR(){
  if(S.jugadores) S.results.jugadores=S.jugadores;
  const m=document.getElementById('rsm');
  if(m) m.innerHTML='<p class="msg-ok" style="margin-top:8px;opacity:.6">Guardando...</p>';
  try{
    const res=await fetch('/api/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:S.results})});
    if(m) m.innerHTML=res.ok?'<p class="msg-ok" style="margin-top:8px">✓ Guardado</p>':'<p class="msg-err" style="margin-top:8px">Error</p>';
  }catch(e){if(m) m.innerHTML='<p class="msg-err" style="margin-top:8px">Error de conexión</p>';}
}

async function init(){
  app.innerHTML='<div style="text-align:center;padding:60px 0;color:var(--text2)">Cargando...</div>';
  await ld();
  render();
}
init();
</script>
